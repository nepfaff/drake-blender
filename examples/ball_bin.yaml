cameras:
    blender_camera:
        name: blender_camera
        renderer_name: blender
        renderer_class: !RenderEngineGltfClientParams
            base_url: http://127.0.0.1:8000
        width: 1024
        height: 1024
        focal: !FovDegrees { x: 40 }
        fps: 8.0
        X_PB:
            translation: [2.0, 0.0, 0.5]
            # rotation: !Rpy { deg: [90, 0, 90] } # Blender
            rotation: !Rpy { deg: [-90.0, 0.0, 90.0] } # OpenCV
    # blender_camera1:
    #     name: blender_camera1
    #     renderer_name: blender # Reuses the existing renderer with the same name
    #     width: 1024
    #     height: 1024
    #     fps: 8.0
    #     X_PB:
    #         translation: [-4.0, -3.2, 4.8]
    #         rotation: !Rpy { deg: [-130, 5, -55] }
    vtk_camera:
        name: vtk_camera
        renderer_name: vtk
        renderer_class: !RenderEngineVtkParams
            backend: EGL
        # For `show_rgb: True` you must also set the `backend: GLX` on prior line
        # and be running locally with an Xorg display server available.
        show_rgb: False
        width: 1024
        height: 1024
        focal: !FovDegrees { x: 40 }
        fps: 8.0
        # background: !Rgba { rgba: [0, 0, 0, 1] } # Not sure why it doesn't like !Rgba...
        X_PB:
            translation: [2.0, 0.0, 0.5]
            rotation: !Rpy { deg: [-90.0, 0.0, 90.0] }
