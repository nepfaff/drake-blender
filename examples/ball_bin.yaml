simulation_duration: 2.0
directives:
- add_model:
    name: iiwa
    file: package://drake_models/iiwa_description/sdf/iiwa14_polytope_collision.sdf
    default_joint_positions:
        iiwa_joint_1: [0]
        iiwa_joint_2: [-0.5]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.5]
        iiwa_joint_5: [0]
        iiwa_joint_6: [ 1.6]
        iiwa_joint_7: [0]
- add_weld:
    parent: world
    child: iiwa::iiwa_link_0
    X_PC:
      translation: [0, 0, 0]
      rotation: !Rpy { deg: [0.0, 0.0, -60.0] }
# - add_model:
#     name: wsg
#     file: package://wsg_description/urdf/wsg50_110_no_fingers_box_collision.urdf
- add_model:
    name: wsg
    file: package://drake_models/wsg_50_description/sdf/schunk_wsg_50_no_tip.sdf
- add_frame:
    name: iiwa::wsg_attach
    X_PF:
      base_frame: iiwa::iiwa_link_7
      translation: [0, 0, 0.09]
      rotation: !Rpy { deg: [-90.0, 0.0, 90.]}
- add_weld:
    parent: iiwa::wsg_attach
    child: wsg::body
- add_frame:
    name: wsg::finray_attach
    X_PF:
      base_frame: wsg::body
      translation: [0, -0.08, 0.00]
      rotation: !Rpy { deg: [0.0, 0.0, 0.0]}
- add_model:
    name: finray
    file: package://blender_models/tri_finray_gripper/finray_finger_assembly_box_collision_2.urdf
- add_weld:
    parent: wsg::finray_attach
    child: finray::base_link
- add_model:
    name: floor
    file: package://manipulation/floor.sdf
- add_weld:
    parent: world
    child: floor::box
    X_PC:
        translation: [0, 0, -.5]

- add_model:
    name: ball_1
    file: package://drake_models/manipulation_station/sphere.sdf
    default_free_body_pose: { base_link: { translation: [0.08, 0.01, 30] } }
